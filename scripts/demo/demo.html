<script>
// ボードの置き方（論理の大きさと縮め方）。
const PW = 410, PH = 660, SCALE = 0.85, PX = 960 - Math.round(PW * SCALE) - 18, PY = 30;

// コルクの地。Corkboard.swift の CorkBackground.tile と同じ乱数・同じ粒で、140pt の絵を敷き詰める。
const corkTile = (() => {
  const size = 140, k = 2, cv = document.createElement("canvas");
  cv.width = cv.height = size * k;
  const g = cv.getContext("2d"); g.scale(k, k);
  g.fillStyle = "#C9A06F"; g.fillRect(0, 0, size, size);
  const grains = ["#9E7243", "#B58653", "#DDB887", "#E8C899", "#87603A"];
  let seed = 0x9E3779B97F4A7C15n;
  const random = () => { seed = (seed * 6364136223846793005n + 1442695040888963407n) & 0xFFFFFFFFFFFFFFFFn; return Number((seed >> 33n) % 10000n) / 10000; };
  for (let i = 0; i < 1100; i++) {
    const x = random() * size, y = size - random() * size; // 元は下が原点
    const r = 0.4 + Math.pow(random(), 2.2) * 2.2;
    const c = grains[Math.floor(random() * grains.length) % grains.length], a = 0.35 + random() * 0.5;
    g.fillStyle = c; g.globalAlpha = a;
    for (const dx of [-size, 0, size]) for (const dy of [-size, 0, size]) {
      if (x + dx + r > 0 && x + dx - r < size && y + dy + r > 0 && y + dy - r < size) { g.beginPath(); g.ellipse(x + dx, y + dy, r, r * 0.8, 0, 0, Math.PI * 2); g.fill(); }
    }
  }
  return cv.toDataURL();
})();
document.getElementById("panel").style.backgroundImage = `url(${corkTile})`;
document.getElementById("panel").style.backgroundSize = "140px 140px";

const PDF_LINES = ["大規模言語モデルは、少数の例を示すだけ", "で新しいタスクに適応できることが知られ", "ている。本研究では、その仕組みを注意機", "構の観点から分析する。"];
const PDF_TEXT = PDF_LINES.join("\n"), JOINED = PDF_LINES.join("");
const WESTERN = s => s.replace(/、/g, "，").replace(/。/g, "．");
document.getElementById("pdflines").innerHTML = PDF_LINES.map((l, i) => `<div><span id="pl${i}">${l}</span></div>`).join("");

const PALETTE = ["#477B70", "#C75543", "#9B7432", "#5C668F", "#7B587D", "#416B7C", "#8A6A4F", "#6D7A45"];
// Theme.paletteIndex と同じハッシュ。
const color = key => { let h = 0; for (const c of key) h = (Math.imul(h, 31) + c.codePointAt(0)) >>> 0; return PALETTE[h % PALETTE.length]; };

// SF Symbols に似せた小さな絵。
const S = (w, body, extra = "") => `<svg class="ico" width="${w}" height="${w}" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" ${extra}>${body}</svg>`;
const SYM = {
  search: w => S(w, '<circle cx="8.5" cy="8.5" r="5.5"/><path d="M12.6 12.6 17 17"/>'),
  sort: w => S(w, '<path d="M6 3v14M2.5 6.5 6 3l3.5 3.5M14 17V3M10.5 13.5 14 17l3.5-3.5"/>'),
  gear: w => S(w, '<circle cx="10" cy="10" r="2.6"/><path d="M10 2.2v2.2M10 15.6v2.2M2.2 10h2.2M15.6 10h2.2M4.5 4.5l1.6 1.6M13.9 13.9l1.6 1.6M4.5 15.5l1.6-1.6M13.9 6.1l1.6-1.6"/><circle cx="10" cy="10" r="5.6"/>'),
  text: w => S(w, '<rect x="4" y="2.5" width="12" height="15" rx="2"/><path d="M7 7h6M7 10h6M7 13h4"/>'),
  table: w => S(w, '<rect x="2.5" y="3.5" width="15" height="13" rx="2"/><path d="M2.5 8h15M2.5 12.3h15M8 3.5v13M12.8 3.5v13"/>'),
  file: w => S(w, '<path d="M5 2h7l4 4v12H5z"/><path d="M12 2v4h4"/>'),
  photo: w => S(w, '<rect x="2.5" y="4" width="15" height="12" rx="2"/><circle cx="7" cy="8" r="1.4"/><path d="m3 15 4.5-4 3 2.5 3-3 4 3.5"/>'),
  link: w => S(w, '<path d="M8.5 11.5a3.5 3.5 0 0 0 5 0l2.5-2.5a3.5 3.5 0 0 0-5-5l-1 1"/><path d="M11.5 8.5a3.5 3.5 0 0 0-5 0L4 11a3.5 3.5 0 0 0 5 5l1-1"/>'),
  formula: w => `<span class="ico" style="font:italic 600 ${w * .85}px 'Times New Roman',serif;line-height:1">ƒx</span>`,
  clock: w => `<svg class="ico" width="${w}" height="${w}" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="currentColor"/><path d="M10 5.5V10l3 2" stroke="#F7F1E3" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>`,
  more: w => S(w, '<circle cx="10" cy="10" r="7.5"/><circle cx="6.8" cy="10" r=".6" fill="currentColor"/><circle cx="10" cy="10" r=".6" fill="currentColor"/><circle cx="13.2" cy="10" r=".6" fill="currentColor"/>'),
  joinLines: w => S(w, '<path d="M2.5 10h11M10 6.5l3.5 3.5-3.5 3.5M17 4v12"/>'),
  abc: w => `<span class="ico" style="font:600 ${w * .62}px -apple-system,sans-serif;letter-spacing:-.3px">abc</span>`,
  wand: w => S(w, '<path d="m3 17 9.5-9.5M11 6l3 3"/><path d="M15 2.5v2M14 3.5h2M17.5 7v1.6M16.7 7.8h1.6M8 2.5v1.6M7.2 3.3h1.6"/>'),
  bolt: w => S(w, '<path d="M11 2 4.5 11.5H10L9 18l6.5-9.5H10z"/>'),
  tag: w => S(w, '<path d="M3 3h6.5l7.5 7.5-6.5 6.5L3 9.5z"/><circle cx="6.5" cy="6.5" r="1"/>'),
  pin: w => S(w, '<path d="M7 3h6M8 3v5l-3 3h10l-3-3V3M10 11v6"/>'),
  pencil: w => S(w, '<path d="m4 16 1-4 8.5-8.5 3 3L8 15z"/>'),
  stack: w => S(w, '<rect x="5" y="7" width="10" height="10" rx="1.5"/><path d="M6.5 4.5h7M8 2.5h4"/>'),
  calPlus: w => S(w, '<rect x="2.5" y="4" width="13" height="12" rx="2"/><path d="M2.5 8h13M6 2.5v3M12 2.5v3"/><circle cx="15.5" cy="15" r="3.3" fill="currentColor" stroke="none"/><path d="M15.5 13.3v3.4M13.8 15h3.4" stroke="#FCF9F1"/>'),
  trash: w => S(w, '<path d="M3.5 5h13M8 5V3h4v2M5 5l1 12h8l1-12M8.5 8v6M11.5 8v6"/>'),
  check: w => `<svg class="ico" width="${w}" height="${w}" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8.5" fill="#fff"/><path d="m6 10.3 2.7 2.7L14.3 7.4" stroke="#4F6C84" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
};
const CHART = w => `<svg width="${w}" height="${Math.round(w * .62)}" viewBox="0 0 100 62"><rect width="100" height="62" fill="#fff"/><path d="M12 6v48h82" stroke="#9AA" fill="none" stroke-width=".8"/>
  <rect x="20" y="30" width="14" height="24" fill="#8FA2B3"/><rect x="42" y="18" width="14" height="36" fill="#5F7A90"/><rect x="64" y="10" width="14" height="44" fill="#C75543"/>
  <text x="50" y="7" font-size="5.5" text-anchor="middle" fill="#444" font-family="sans-serif">精度の比較</text></svg>`;
const APPS = {
  "com.apple.Preview": ["プレビュー", "#3E8EE8", "P"], "com.apple.screencaptureui": ["スクリーンショット", "#6B7479", "S"],
  "com.microsoft.Excel": ["Microsoft Excel", "#1F7A45", "X"], "com.apple.finder": ["Finder", "#3C9BF0", "F"],
  "io.github.kobito-tools.corkclip": ["CorkClip", "#8B5E3A", "C"], "com.apple.Safari": ["Safari", "#2F86E8", "S"],
};
const appIcon = b => `<span class="appi" style="background:${APPS[b][1]}">${APPS[b][2]}</span>`;

// 履歴（架空の内容）。styles は PasteStyle.swift と同じ並び。
const MORE = ["ほかの変換…", "more"];
const CLIPS = [
  { id: "pdf", kind: "text", kindLabel: "テキスト", bundle: "com.apple.Preview", time: "10 秒前", tags: ["論文"], display: JOINED,
    styles: [["そのまま", "text"], ["改行を消す", "joinLines"], ["「，．」に", "abc"], MORE],
    body: () => esc(PDF_TEXT), result: [null, JOINED, WESTERN(PDF_TEXT)], foot: "2026/09/30 10:24・コピー1回・貼り付け0回・232 bytes・76文字" },
  { id: "graph", kind: "photo", kindLabel: "画像", bundle: "com.apple.screencaptureui", time: "3 分前", tags: [], display: "画像 1280×800",
    styles: [["画像", "photo"], ["画像の文字", "search"], MORE],
    body: () => `<div style="display:flex;justify-content:center">${CHART(180)}</div><div style="font-size:11px;color:#8E8A83;margin-top:4px">画像の文字：精度の比較</div>`,
    foot: "2026/09/30 10:21・コピー1回・貼り付け0回・184 KB" },
  { id: "table", kind: "table", kindLabel: "書式付き", bundle: "com.microsoft.Excel", time: "12 分前", tags: ["実験"], display: "条件　精度　時間",
    styles: [["書式付き", "table"], ["プレーン", "abc"], ["表 → LaTeX", "table"], ["表 → Markdown", "table"], ["表 → CSV", "table"], MORE],
    body: () => `<table class="tb"><tr><td>条件</td><td>精度</td><td>時間</td></tr><tr><td>手法A</td><td>0.82</td><td>1.4s</td></tr><tr><td>手法B</td><td>0.87</td><td>2.1s</td></tr><tr><td>手法C</td><td>0.91</td><td>3.0s</td></tr></table>`,
    foot: "2026/09/30 10:12・コピー2回・貼り付け1回・6 KB・48文字" },
  { id: "file", kind: "file", kindLabel: "ファイル", bundle: "com.apple.finder", time: "1 時間前", tags: [], display: "実験データ.csv",
    styles: [["ファイル", "file"], ["パス", "file"], ["~ のパス", "file"], ["ファイル名", "text"], ["file://", "link"]],
    body: () => `<div style="display:flex;gap:8px;align-items:flex-start;white-space:normal"><span style="color:#5C668F">${SYM.file(28)}</span><div><div>実験データ.csv</div><div style="font-size:11px;color:#8E8A83">~/Research/2026</div></div></div>`,
    foot: "2026/09/30 09:20・コピー1回・貼り付け0回・1 KB" },
  { id: "formula", kind: "formula", kindLabel: "数式", bundle: "io.github.kobito-tools.corkclip", time: "1 日前", tags: ["論文"], display: "\\int_0^1 f(x)\\,dx = F(1) - F(0)",
    styles: [["数式画像", "formula"], ["LaTeX の式", "text"], MORE],
    body: () => `<div class="mathimg">∫<sub style="font-size:14px">0</sub><sup style="font-size:14px">1</sup> f(x) dx = F(1) − F(0)</div><div style="font:11px Menlo,monospace;color:#8E8A83">\\int_0^1 f(x)\\,dx = F(1) - F(0)</div>`,
    foot: "2026/09/29 17:05・コピー1回・貼り付け3回・38 KB" },
  { id: "link", kind: "link", kindLabel: "リンク", bundle: "com.apple.Safari", time: "1 日前", tags: ["論文"], display: "https://example.org/papers/attention-2026",
    styles: [["そのまま", "link"], MORE],
    body: () => "https://example.org/papers/attention-2026", foot: "2026/09/29 16:40・コピー1回・貼り付け0回・41 bytes・41文字" },
];
// → の画面（ModeViews.swift のほかの変換と、PanelModel.swift のできること）。
const TRANSFORMS = ["改行を消す", "句読点を「，．」に", "句読点を「、。」に", "英数字・記号を半角に", "半角カタカナを全角に", "余分な空白を消す", "大文字に", "小文字に", "文の先頭だけ大文字に",
  "表を LaTeX の tabular に", "表を Markdown に", "表を CSV に", "引用（> ）にする", "箇条書き（- ）にする", "箇条書き（・）にする", "番号付き（1. ）にする", "数式画像にする"];
const TF_RESULT = [JOINED, WESTERN(PDF_TEXT), PDF_TEXT];
const ACTIONS = [["T", "tag", "タグを付ける・外す", "⌘T"], ["P", "pin", "ピン留めする", "⌘P"], ["E", "pencil", "編集してから貼る", "⌘E"], ["L", "formula", "数式画像を作る", "⌘L"],
  ["K", "stack", "ペーストスタックに積む", ""], ["S", "calPlus", "カードに残す", "⌘S"], ["D", "trash", "履歴から削除", "⌘⌫"]];

function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;"); }
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => 1 - Math.pow(1 - clamp(x), 3);
const $ = id => document.getElementById(id);
const pressed = (t, at, len = .2) => t >= at && t < at + len;

// 何秒に何が起きるか：[出す, 消す, キー, 字幕, キーを押す時刻]
const CAPTIONS = [
  [1.2, 3.1, ["⌘", "C"], "Copy as usual. CorkClip keeps it as it is", 1.6],
  [3.3, 4.9, ["⌥", "⌘", "V"], "Bring up the board from the screen edge", 3.7],
  [5.0, 8.2, ["↑", "↓"], "Pick an item to see it up close", 5.4],
  [8.3, 10.7, ["⇥"], "Choose how to paste, and check the result first", 8.9],
  [10.8, 12.3, ["Enter"], "Paste", 11.0],
  [12.4, 14.9, ["#論文"], "Filter by #tag, type: or app:", 13.2],
  [15.0, 18.0, ["→"], "Other transforms, and what you can do", 15.3],
  [18.1, 20.0, ["S"], "One letter runs an action: keep it as a card", 18.5],
];
const DOWNS = [5.4, 6.0, 6.6], UPS = [7.3, 7.55, 7.8];
const TAB_AT = 8.9, ENTER_AT = 11.0, RIGHT_AT = 15.3, TF_DOWN = [16.3, 17.1], S_AT = 18.5;

function panelX(t) {
  // 出ている区間 [出す, しまう]
  const spans = [[3.75, 11.05], [12.6, 20.1]];
  for (const [a, b] of spans) {
    if (t >= a && t < b + 0.2) {
      const p = t < b ? ease((t - a) / 0.2) : 1 - ease((t - b) / 0.18);
      return { x: PX + (1 - p) * 70, o: p };
    }
  }
  return null;
}

function render(t) {
  // 窓：初めは PDF が前、3.3 秒で書類が前に。
  const docFront = t >= 3.3;
  $("docwin").style.zIndex = docFront ? 2 : 1; $("pdfwin").style.zIndex = docFront ? 1 : 2;
  $("docwin").classList.toggle("inactive", !docFront); $("pdfwin").classList.toggle("inactive", docFront);
  $("appname").textContent = docFront ? "テキストエディット" : "プレビュー";
  // PDF の文を選ぶ。
  const selP = clamp((t - 0.3) / 1.0) * PDF_LINES.length;
  PDF_LINES.forEach((_, i) => $("pl" + i).className = selP > i + 0.2 ? "sel" : "");
  // コピーしたら、メニューバーのアイコンへ小さく飛ぶ。
  const fp = (t - 1.75) / 0.55, fly = $("fly");
  fly.style.display = fp > 0 && fp < 1 ? "block" : "none";
  if (fp > 0 && fp < 1) { const e = ease(fp); fly.style.left = 470 + (816 - 470) * e + "px"; fly.style.top = 160 + (4 - 160) * e + "px"; fly.style.opacity = 1 - fp * .6; fly.style.transform = `scale(${1 - e * .5})`; }
  $("mbicon").style.background = t > 2.25 && t < 2.7 ? "rgba(79,108,132,.35)" : "transparent";
  // 貼った文（改行を消して貼る）。
  $("paste").innerHTML = t >= 11.25 ? `<span style="border-radius:3px;background:rgba(79,108,132,${.28 * (1 - clamp((t - 11.4) / 1))})">${JOINED}</span>` : "";
  $("caret").style.visibility = docFront && Math.floor(t * 2) % 2 === 0 ? "visible" : "hidden";

  // ボード
  const pos = panelX(t), panel = $("panel"), kob = $("kobito");
  if (!pos) { panel.style.display = kob.style.display = "none"; } else {
    panel.style.display = "flex"; kob.style.display = "block";
    panel.style.left = pos.x + "px"; panel.style.opacity = pos.o; kob.style.opacity = pos.o;
    panel.style.transform = `scale(${SCALE})`;
    kob.style.left = pos.x - 46 + "px"; kob.style.top = PY + PH * SCALE * .42 - 19 + "px";
    kob.style.transform = `rotate(${-0.02 + 0.05 * Math.sin(t * Math.PI * 2 / 3.8)}rad)`;
    panel.innerHTML = panelHTML(t);
    const list = panel.querySelector(".list"), on = panel.querySelector(".clip.on");
    if (list && on) list.scrollTop = Math.max(0, on.offsetTop + on.offsetHeight + 6 - list.clientHeight);
  }

  // 字幕
  const c = CAPTIONS.find(([a, b]) => t >= a && t < b), cap = $("cap");
  if (!c) cap.style.display = "none"; else {
    cap.style.display = "flex";
    cap.style.opacity = Math.min(clamp((t - c[0]) / .15), clamp((c[1] - t) / .15));
    const arrows = c[2][0] === "↑";
    const keys = c[2].map((k, i) => {
      const d = arrows ? (k === "↓" ? DOWNS : UPS).some(x => pressed(t, x, .15)) : pressed(t, c[4], .18);
      return (i ? `<span class="plus">${arrows ? "/" : "+"}</span>` : "") + `<span class="key${d ? " down" : ""}">${k}</span>`;
    });
    cap.innerHTML = keys.join("") + `<span class="txt">${c[3]}</span>`;
  }
}

const pin = (cls = "", c = "#C9A24D") => `<span class="pin ${cls}" style="--pc:${c}"></span>`;
const keycap = (k, down = false, small = false) => `<span class="kc${small ? " s" : ""}${down ? " down" : ""}">${k}</span>`;

function panelHTML(t) {
  const second = t >= 12.4;
  // 検索
  const typed = !second ? "" : t < 13.2 ? "" : t < 13.5 ? "#" : t < 13.8 ? "#論" : "#論文";
  const rows = typed === "#論文" ? CLIPS.filter(c => c.tags.includes("論文")) : CLIPS;
  // 選択と貼り方
  let sel = 0;
  if (!second) sel = DOWNS.filter(d => t >= d).length - UPS.filter(d => t >= d).length;
  const clip = rows[sel];
  const styleIndex = !second && t >= TAB_AT ? 1 : 0;
  const mode = second && t >= RIGHT_AT && t < S_AT + 0.1 ? "transform" : "list";
  const tfIndex = TF_DOWN.filter(d => t >= d).length;
  const toast = second && t >= S_AT + 0.1 ? "カードに残しました（9月30日のクリップ・1件）" : null;
  const lastMethod = second ? "改行を消す" : null; // 1回目に「改行を消す」で貼ったので

  let h = `<div class="header strip"><div class="field">${SYM.search(15)}`
    + (typed ? `<span class="q">${typed}</span><span class="caret" style="height:15px;visibility:${Math.floor(t * 2) % 2 ? "hidden" : "visible"}"></span>` : `<span class="ph">検索（#タグ type:画像 app:Word …）</span>`)
    + `</div>${SYM.sort(16)}${SYM.gear(16)}</div>`;

  if (mode === "transform") {
    h += `<div class="well" style="height:250px">${pin("l")}${pin("r")}<div class="mode" style="height:100%">`
      + `<div class="mtitle">${SYM.wand(17)}ほかの変換<span class="r">space でつなげる</span></div>`
      + `<div class="tf"><div class="names">${TRANSFORMS.map((x, i) => `<div class="${i === tfIndex ? "on" : ""}">${x}</div>`).join("")}</div>`
      + `<div class="out">${esc(TF_RESULT[tfIndex])}</div></div></div></div>`;
    const sDown = pressed(t, S_AT, .2);
    h += `<div class="well" style="flex:1;min-height:0">${pin("l")}${pin("r")}<div class="mode" style="gap:6px"><div class="mtitle">${SYM.bolt(17)}この項目にできること</div><div style="display:flex;flex-direction:column;gap:1px">`
      + ACTIONS.map(([k, sy, l, s]) => `<div class="act${k === "S" && sDown ? " on" : ""}"><span class="k${k === "S" && sDown ? " down" : ""}">${k}</span><span class="sy">${SYM[sy](16)}</span>${l}<span class="sc">${s}</span></div>`).join("")
      + `</div></div></div>`;
    h += `<div class="hints strip">${[["⏎", "変換して貼る"], ["英字", "できること"], ["⇥", "切り替え"], ["esc", "戻る"]].map(([k, x]) => `<span>${keycap(k, false, true)}${x}</span>`).join("")}</div>`;
    return h;
  }

  // プレビュー
  const [style] = clip.styles[styleIndex];
  const b = APPS[clip.bundle];
  let body = clip.body();
  if (styleIndex > 0) body = `<div class="styled">${SYM[clip.styles[styleIndex][1]](12)}「${style}」で貼られる内容</div>${esc(clip.result[styleIndex])}`;
  h += `<div class="well" style="height:248px">${pin("l")}${pin("r")}<div class="wtitle">プレビュー</div>`
    + `<div class="pvhead">${appIcon(clip.bundle)}${b[0]}<span class="tags">${clip.tags.map(x => "#" + x).join(" ")}</span><span class="kind">${SYM[clip.kind](13)}${clip.kindLabel}</span></div>`
    + `<div class="pvbody">${body}</div><div class="pvfoot">${clip.foot}</div>`
    + `<div class="styles"><span class="lbl">貼り方</span><div class="chips">${clip.styles.map(([s, sy], i) => `<span class="chip${i === styleIndex ? " on" : ""}">${SYM[sy](13)}${s}</span>`).join("")}</div></div></div>`;

  // 履歴のカード
  h += `<div class="list"><div class="inner"><div class="section strip">${SYM.clock(10)} ${typed === "#論文" ? "見つかった履歴" : "履歴"} <span class="count">${rows.length}</span></div>`;
  rows.forEach((c, i) => {
    const tint = color(c.bundle);
    const lead = c.kind === "photo" ? CHART(42) : SYM[c.kind](19);
    const tags = c.tags.map(x => `<span class="tag" style="color:${color(x)};background:color-mix(in srgb,${color(x)} 13%,transparent)">#${x}</span>`).join("");
    h += `<div class="clip note${i === sel ? " on" : ""}" style="--tint:${tint}"><span class="bar4"></span>${pin()}<div class="lead" ${c.kind === "photo" ? 'style="background:#fff"' : ""}>${lead}</div>`
      + `<div class="cmain"><div class="ctext">${esc(c.display)}</div><div class="cmeta">${appIcon(c.bundle)}${APPS[c.bundle][0]} · ${c.time}${tags}</div></div><span class="num">⌘${i + 1}</span></div>`;
  });
  h += `</div></div>`;
  if (toast) h += `<div class="toast">${SYM.check(15)}${toast}</div>`;

  // 主なキー（PanelView.swift の ShortcutGuide）
  const enter = styleIndex === 0 ? "そのまま貼る" : `「${style}」で貼る`;
  const last = lastMethod ? `前回の「${lastMethod}」で貼る` : "前回の貼り方で貼る";
  const enterDown = !second && pressed(t, ENTER_AT), tabDown = !second && pressed(t, TAB_AT), rightDown = second && pressed(t, RIGHT_AT);
  const guideRows = [
    [[keycap("⏎ Enter", enterDown)], enter, styleIndex > 0],
    [[keycap("⇧ Shift"), keycap("⏎ Enter")], "書式を除いて貼る"],
    [[keycap("⌃ Ctrl"), keycap("⏎ Enter")], last],
    [[keycap("→", rightDown)], "ほかの変換・できること"],
  ];
  h += `<div class="guide strip"><div class="top"><b>主なキー</b>${keycap("⇥", tabDown, true)}貼り方を切り替え<span style="width:4px"></span>${keycap("⌘/", false, true)}キーの一覧</div><div class="grid">`
    + guideRows.map(([keys, text, hot]) => `<div class="keys">${keys.join('<span class="plus">+</span>')}</div><div class="tx${hot ? " hot" : ""}">${text}</div>`).join("")
    + `</div></div>`;
  return h;
}
window.DURATION = 20.6;
render(Number(new URLSearchParams(location.search).get("t") || 9.5));
</script></body></html>
